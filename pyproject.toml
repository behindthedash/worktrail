worktrail-poll-run = "worktrail.router.poll_run:main"
worktrail-pre-pr-gate = "worktrail.router.pre_pr_gate:main"
worktrail-preflight = "worktrail.router.preflight:main"
worktrail-quarantine-selfcheck = "worktrail.router.quarantine_selfcheck:main"
worktrail-reconcile-pr-labels = "worktrail.router.reconcile_pr_labels:main"
worktrail-resolve-repo = "worktrail.router.resolve_repo:main"
worktrail-release-gate = "worktrail.router.release_gate:main"
worktrail-run-record = "worktrail.router.run_record:main"
worktrail-skill-dispatch = "worktrail.router.skill_dispatch:main"
worktrail-skill-prose-scan = "worktrail.router.skill_prose_advisory_scan:main"
