[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worktrail"
version = "0.8.0"
description = "Spec-format-agnostic task orchestration: parallel worktree fan-out, a route classifier, and a work-queue handoff system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "requests>=2.34.2",
]

[project.scripts]
worktrail-compile = "worktrail.conductor.compile:main"
worktrail-orchestrate = "worktrail.orchestrator.orchestrate:main"
worktrail-live = "worktrail.orchestrator.live:main"
worktrail-integrate = "worktrail.orchestrator.integrate:main"
worktrail-spec-create = "worktrail.taskformats.create:main"
worktrail-task-lifecycle = "worktrail.taskformats.devkit.cli:main"
worktrail-agent-capacity = "worktrail.orchestrator.agent_capacity:main"
worktrail-check-agent-contract = "worktrail.orchestrator.check_agent_contract:main"
worktrail-work-queue = "worktrail.workqueue.work_queue:main"
worktrail-handoff = "worktrail.workqueue.create_handoff:main"
worktrail-score-candidates = "worktrail.workqueue.score_candidates:main"
worktrail-dist-tag-watch = "worktrail.workqueue.dist_tag_watch:main"
worktrail-backfill-recommended-route = "worktrail.workqueue.backfill_recommended_route:main"
worktrail-drain = "worktrail.drain.drain:main"
worktrail-audit-overlaps = "worktrail.router.audit_overlaps:main"
worktrail-automerge-preflight = "worktrail.router.automerge_preflight:main"
worktrail-check-cache-freshness = "worktrail.router.check_cache_freshness:main"
worktrail-check-clarification-integrity = "worktrail.router.check_clarification_integrity:main"
worktrail-check-repo-freshness = "worktrail.router.check_repo_freshness:main"
worktrail-check-spec-collision = "worktrail.router.check_spec_collision:main"
worktrail-check-spec-sync = "worktrail.router.check_spec_sync:main"
worktrail-classify = "worktrail.router.classify:main"
worktrail-classify-handoff = "worktrail.router.classify_handoff:main"
worktrail-cluster-log-summary = "worktrail.router.cluster_log_summary:main"
worktrail-consolidate-cluster = "worktrail.router.consolidate_cluster:main"
worktrail-dashboard = "worktrail.router.dashboard:main"
worktrail-go-seed = "worktrail.router.go_seed:main"
worktrail-handoff-seed = "worktrail.router.handoff_seed:main"
worktrail-live-status = "worktrail.router.live_status:main"
worktrail-overlap-check = "worktrail.router.overlap_check:main"
worktrail-policy = "worktrail.router.policy:main"
worktrail-policy-selfcheck = "worktrail.router.policy_selfcheck:main"
worktrail-poll-run = "worktrail.router.poll_run:main"
worktrail-pre-pr-gate = "worktrail.router.pre_pr_gate:main"
worktrail-resolve-repo = "worktrail.router.resolve_repo:main"
worktrail-run-record = "worktrail.router.run_record:main"
worktrail-skill-dispatch = "worktrail.router.skill_dispatch:main"
worktrail-spec-sync-sweep = "worktrail.router.spec_sync_sweep:main"
worktrail-tier-accuracy = "worktrail.router.tier_accuracy:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
worktrail = [".fixtures/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "hooks"]
