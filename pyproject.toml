[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worktrail"
version = "1.1.41"
description = "Spec-format-agnostic task orchestration: parallel worktree fan-out, a route classifier, and a work-queue handoff system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "requests>=2.34.2",
    "build>=1.0",
    "ruff",
]

[project.scripts]
worktrail-bootstrap-node-modules = "worktrail.orchestrator.bootstrap_node_modules:main"
worktrail-compile = "worktrail.conductor.compile:main"
worktrail-plan-audit = "worktrail.conductor.plan_audit:main"
worktrail-orchestrate = "worktrail.orchestrator.orchestrate:main"
worktrail-live = "worktrail.orchestrator.live:main"
worktrail-detach = "worktrail.runtime.detach:main"
worktrail-integrate = "worktrail.orchestrator.integrate:main"
worktrail-spec-create = "worktrail.taskformats.create:main"
worktrail-task-lifecycle = "worktrail.taskformats.devkit.cli:main"
worktrail-agent-capacity = "worktrail.orchestrator.agent_capacity:main"
worktrail-check-agent-contract = "worktrail.orchestrator.check_agent_contract:main"
worktrail-codex-probe = "worktrail.orchestrator.codex_probe:main"
worktrail-check-provider-commands = "worktrail.orchestrator.provider_command_compatibility:main"
worktrail-work-queue = "worktrail.workqueue.work_queue:main"
worktrail-handoff = "worktrail.workqueue.create_handoff:main"
worktrail-check-duplicate-brief = "worktrail.workqueue.create_handoff:main_check_duplicate"
worktrail-append-duplicate-signal = "worktrail.workqueue.create_handoff:main_append_duplicate_signal"
worktrail-queue-triage = "worktrail.workqueue.queue_triage:main"
worktrail-score-candidates = "worktrail.workqueue.score_candidates:main"
worktrail-dist-tag-watch = "worktrail.workqueue.dist_tag_watch:main"
worktrail-backfill-recommended-route = "worktrail.workqueue.backfill_recommended_route:main"
worktrail-backfill-created-quoting = "worktrail.workqueue.backfill_created_quoting:main"
worktrail-backfill-focus-style = "worktrail.workqueue.backfill_focus_style:main"
worktrail-seed-backlog = "worktrail.workqueue.seed_backlog:main"
worktrail-decision = "worktrail.workqueue.decisions:main"
worktrail-drain = "worktrail.drain.drain:main"
worktrail-audit-delivery = "worktrail.router.audit_delivery:main"
worktrail-audit-overlaps = "worktrail.router.audit_overlaps:main"
worktrail-audit-postmerge = "worktrail.router.audit_postmerge:main"
worktrail-automerge-preflight = "worktrail.router.automerge_preflight:main"
worktrail-automerge-selfcheck = "worktrail.router.automerge_selfcheck:main"
worktrail-branch-selfcheck = "worktrail.router.branch_selfcheck:main"
worktrail-check-cache-freshness = "worktrail.router.check_cache_freshness:main"
worktrail-check-clarification-integrity = "worktrail.router.check_clarification_integrity:main"
worktrail-check-deferred-work-handoff = "worktrail.router.check_deferred_work_handoff:main"
worktrail-check-durable-artifact-capture-gate = "worktrail.router.check_durable_artifact_capture_gate:main"
worktrail-check-dod-verification = "worktrail.router.check_dod_verification:main"
worktrail-check-epic-collision = "worktrail.router.check_epic_collision:main"
worktrail-check-openspec-propose-resume = "worktrail.router.check_openspec_propose_resume:main"
