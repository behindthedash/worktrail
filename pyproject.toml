worktrail-check-repo-freshness = "worktrail.router.check_repo_freshness:main"
worktrail-check-resumable-state = "worktrail.router.check_resumable_state:main"
worktrail-check-review-threads = "worktrail.router.check_review_threads:main"
worktrail-check-spec-collision = "worktrail.router.check_spec_collision:main"
worktrail-check-spec-sync = "worktrail.router.check_spec_sync:main"
worktrail-classifier-coverage = "worktrail.router.classifier_coverage:main"
worktrail-classify = "worktrail.router.classify:main"
worktrail-classify-handoff = "worktrail.router.classify_handoff:main"
worktrail-cluster-log-summary = "worktrail.router.cluster_log_summary:main"
