worktrail-overlap-check = "worktrail.router.overlap_check:main"
worktrail-policy = "worktrail.router.policy:main"
worktrail-routing = "worktrail.router.routing_cli:main"
worktrail-repo-init = "worktrail.onboarding.repo_init:main"
worktrail-policy-drift-selfcheck = "worktrail.router.policy_drift_selfcheck:main"
