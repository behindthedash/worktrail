# /go policy for Worktrail. The commands mirror the repository's offline CI
# checks without installing dependencies or requiring network access.
pre_pr_cmd: "PYTHONPATH=src pytest -q && PYTHONPATH=src python3 -m worktrail.orchestrator.orchestrate check"
# orchestrator-throughput 7.1: format before every commit so it never shows up as diff noise.
pre_commit_cmd: "ruff check . --fix && ruff format ."
# v1.0 release freeze (2026-08-08): unattended auto-pick schedules ONLY briefs
# with `triage: blocker` for this repo; capture stays open, everything else
# waits. Readiness is measured, not felt: `worktrail-release-gate --repo .`
# (N consecutive clean runs, zero interventions). Remove this key to lift the
# freeze after v1.0 ships.
release_gate: v1.0
# orchestrator-throughput 7.1: check lint/format at integrate so it can't slip past pre_commit_cmd.
integrate_smoke_cmd: "PYTHONPATH=src python3 -m worktrail.orchestrator.orchestrate check && ruff check . && ruff format --check ."
base_branch: main
# orchestrator-throughput 7.1: small diffs skip the full reviewer pass.
review_skip_max_diff_lines: 40
# docs_only_paths: when every changed path matches one of these globs, the
# pre-PR gate skips pre_pr_cmd AND resolve_pr_labels() caps risk at low
# (see #102 — the #86 authz false-positive on a docs-only spec PR).
# Deliberately narrower than datalena's blanket "**/*.md": this repo's
# skills/*/SKILL.md are load-bearing plugin surface (test_plugin_surface.py),
# so a skill-text diff must still run tests and keep its classified risk.
docs_only_paths:
  - "docs/**"
  - "openspec/**"
  - "AGENTS.md"
  - "README.md"
  - "CLAUDE.md"
  - ".gitignore"
automerge:
  enabled: true
  max_risk: medium
# add_ons: opt-in per-repo worktrail add-ons (worktrail.addons), run after a
# task's own commit and before push/PR. aspens keeps skill-doc sync landed in
# the same PR the task produced instead of racing worktree teardown (spec
# post-task-cmd-addon). required: false (default) — a flaky aspens CLI must
# never block an unrelated task's PR.
#
# Re-enabled 2026-09-01: aspens >= 0.9.0 (fork PRs #5, #10, #11) now writes the
# Skills index to its own .claude/aspens-index.md and only ever appends a
# delimited <!-- aspens:start/end --> block to AGENTS.md/CLAUDE.md. Verified live
# in a scratch worktree: two consecutive `aspens doc sync` runs left every byte
# outside the block unchanged (pure insertions, idempotent on the second run).
# History: disabled 2026-08-16 after doc sync gutted 146 lines of hand-authored
# AGENTS.md down to a 17-line stub (brief 20260816-171633).
add_ons:
  aspens:
    enabled: true
    target: claude
    required: false
