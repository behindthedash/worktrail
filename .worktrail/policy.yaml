# /go policy for Worktrail. The commands mirror the repository's offline CI
# checks without installing dependencies or requiring network access.
pre_pr_cmd: "PYTHONPATH=src pytest -q && PYTHONPATH=src python3 -m worktrail.orchestrator.orchestrate check"
# orchestrator-throughput 7.1: format before every commit so it never shows up as diff noise.
# Routed through scripts/ci/ruff_pinned.py, never a bare `ruff`: a developer
# machine's global ruff drifts from pyproject's pin (0.16.5 vs 0.16.7 on
# 2026-09-19) and a local PASS is only evidence about CI when the two builds
# match.
pre_commit_cmd: "python3 scripts/ci/ruff_pinned.py check . --fix && python3 scripts/ci/ruff_pinned.py format ."
# The v1.0 release freeze (2026-08-08) is LIFTED as of 2026-09-19. Its own
# stated condition -- "remove this key to lift the freeze after v1.0 ships" --
# was met long ago: pyproject reads version 1.1.41. Leaving the key set kept
# unattended auto-pick restricted to `triage: blocker` briefs for a release
# that had already shipped 41 patch versions earlier, which is what left brief
# 20260918-195552 self-deferred until it was asked for by hand. Unattended
# scheduling for this repo is now governed by the same rules as every other.
# orchestrator-throughput 7.1: check lint/format at integrate so it can't slip past pre_commit_cmd.
# check_shebang_exec_bits.py is not redundant with ruff here: ruff disables
# EXE001/EXE002 on Windows and WSL (its own docs), so on this fleet's dev
# machines those two rules are off locally and on in CI -- PR #1279 shipped
# five files that failed CI on exactly that. It answers the same question from
# git's index, which every platform agrees on.
integrate_smoke_cmd: "PYTHONPATH=src python3 -m worktrail.orchestrator.orchestrate check && python3 scripts/ci/ruff_pinned.py check . && python3 scripts/ci/ruff_pinned.py format --check . && python3 scripts/ci/check_shebang_exec_bits.py"
# smoke-gate-flaky-retry-policy: one bounded re-run of the smoke command on a
# non-zero exit, so a load-flaky red on this 4-runner host does not quarantine a
# group whose own diff is fine (run agent-capacity-expired-gate-hygiene, 2026-09-05,
# lost 2 of 3 groups that way). A pass-after-retry is never silent: it prints FLAKY
# and lands in the run journal's smoke_flakes map -- a repeat entry for the same
# suite means fix the flake, not raise this number.
integrate_smoke_retries: 1
base_branch: main
# orchestrator-throughput 7.1: small diffs skip the full reviewer pass.
review_skip_max_diff_lines: 40
# docs_only_paths: when every changed path matches one of these globs, the
# pre-PR gate skips pre_pr_cmd AND resolve_pr_labels() caps risk at low
# (see #102 — the #86 authz false-positive on a docs-only spec PR).
# Deliberately narrower than datalena's blanket "**/*.md": this repo's
# skills/*/SKILL.md are load-bearing plugin surface (test_plugin_surface.py),
# so a skill-text diff must still run tests and keep its classified risk.
docs_only_paths:
  - "docs/**"
  - "openspec/**"
  - "AGENTS.md"
  - "README.md"
  - "CLAUDE.md"
  - ".gitignore"
automerge:
  enabled: true
  max_risk: medium
# add_ons: opt-in per-repo worktrail add-ons (worktrail.addons), run after a
# task's own commit and before push/PR. aspens keeps skill-doc sync landed in
# the same PR the task produced instead of racing worktree teardown (spec
# post-task-cmd-addon). required: false (default) — a flaky aspens CLI must
# never block an unrelated task's PR.
#
# Re-enabled 2026-09-01: aspens >= 0.9.0 (fork PRs #5, #10, #11) now writes the
# Skills index to its own .claude/aspens-index.md and only ever appends a
# delimited <!-- aspens:start/end --> block to AGENTS.md/CLAUDE.md. Verified live
# in a scratch worktree: two consecutive `aspens doc sync` runs left every byte
# outside the block unchanged (pure insertions, idempotent on the second run).
# History: disabled 2026-08-16 after doc sync gutted 146 lines of hand-authored
# AGENTS.md down to a 17-line stub (brief 20260816-171633).
add_ons:
  aspens:
    enabled: true
    target: claude
    required: false
