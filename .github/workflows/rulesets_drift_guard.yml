name: 'CI: Rulesets Drift Guard'

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/rulesets/**'
      - '.github/workflows/rulesets_drift_guard.yml'
      - 'scripts/ci/rulesets/**'
  workflow_dispatch: {}
  schedule:
    # Weekly drift check to catch out-of-band GitHub UI edits.
    - cron: '0 9 * * 1'

concurrency:
  group: rulesets-drift-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rulesets-check:
    name: Rulesets drift check
    runs-on: ubuntu-latest
    env:
      RULESETS_APP_ID: ${{ vars.RELEASE_NOTES_APP_ID }}
      RULESETS_APP_PRIVATE_KEY: ${{ secrets.RELEASE_NOTES_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r scripts/ci/rulesets/requirements.txt

      # Reading live rulesets requires repository Administration:Read, which
      # is a GitHub App installation permission — it cannot be granted to the
      # default GITHUB_TOKEN via the workflow-level `permissions:` block
      # (`administration` is not one of the scopes that key accepts; see
      # scripts/ci/rulesets/README.md for the upstream bug this avoids). Mint
      # a token from the App already installed for bot automation instead.
      - name: Generate rulesets-check bot token
        id: app-token
        if: ${{ env.RULESETS_APP_ID != '' && env.RULESETS_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.RULESETS_APP_ID }}
          private-key: ${{ env.RULESETS_APP_PRIVATE_KEY }}

      - name: Check committed rulesets against live GitHub rulesets
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/ci/rulesets/rulesets_sync.py --check

      - name: Skip live ruleset check when App credentials are unavailable
        if: ${{ steps.app-token.outputs.token == '' }}
        run: echo "Ruleset drift check skipped because repository App credentials are unavailable to this pull request."
