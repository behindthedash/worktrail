name: 'CI: Auto-merge on open'
on:
  pull_request:
    # `ready_for_review` so auto-merge engages when a draft is marked ready;
    # the `opened`/`reopened` runs are skipped below while it is still a draft.
    # `labeled` so a go:risk-low/medium label applied AFTER PR creation (the
    # normal case for a PR the classifier never touched) re-triggers
    # eligibility instead of leaving the PR stuck with no way to arm
    # auto-merge short of a manual `gh pr merge --auto` or a new push.
    types: [opened, reopened, ready_for_review, labeled, unlabeled]

# The group includes the triggering event action: a `labeled` run must never
# cancel an in-flight `opened`/`reopened`/`ready_for_review` run for the same
# PR -- a cancelled run of a required check stays on the head SHA and blocks
# the merge/auto-merge even after a newer run succeeds (same failure class the
# version-bump check's concurrency group guarded against, PRs #344-#346 --
# that check no longer triggers on labeled/unlabeled at all as of
# release_metadata_check.yml, but the cancellation hazard this group guards
# against is general to any required check with a labeled/unlabeled trigger).
#
# The group also includes the label name for labeled/unlabeled events: a PR
# opened with two `gh pr create --label` flags fires two separate `labeled`
# webhook events (one per label), which would otherwise share one
# `...-labeled` group and cancel each other (PR #393). Empty for
# opened/reopened/ready_for_review (no `label` on the event payload), so
# those keep deduping as before.
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}-${{ github.event.action }}-${{ github.event.label.name || '' }}
  cancel-in-progress: true

jobs:
  test-automerge-eligibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash scripts/ci/test_automerge_eligibility.sh

  auto-merge:
    # Never attempt auto-merge on a draft PR — GitHub rejects it
    # ("Pull request is a draft") which fails this check red on every draft.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check automerge eligibility
        id: check-automerge
        run: |
          labels=$(gh pr view "${{ github.event.pull_request.number }}" \
            --json labels --jq '.labels[].name' -R "${{ github.repository }}")
          has_no_automerge="false"
          if echo "$labels" | grep -q "^go:no-automerge$"; then
            has_no_automerge="true"
          fi
          has_risk_label="false"
          if echo "$labels" | grep -qE "^go:risk-(low|medium)$"; then
            has_risk_label="true"
          fi

          bash scripts/ci/automerge_eligibility.sh \
            --github-output "$GITHUB_OUTPUT" \
            --has-no-automerge-label "$has_no_automerge" \
            --has-risk-label "$has_risk_label"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Native GitHub auto-merge persists once armed regardless of later label
      # changes -- an eligibility re-check on a later `labeled` event that
      # only skips re-arming does nothing to stop a merge already armed on an
      # earlier, more permissive trigger. Verified live 2026-08-01 (devops
      # PR #89): go:no-automerge was applied AFTER the PR's `opened` event
      # had already armed auto-merge on the (then-eligible) old logic, and
      # with no trigger or disarm step to catch it, the PR merged anyway
      # once checks passed. Disarming on every ineligible re-check closes
      # that gap; `|| true` because disabling auto-merge on a PR that was
      # never armed is a harmless no-op, not a failure.
      - name: Disarm on ineligible
        if: steps.check-automerge.outputs.eligible != 'true'
        run: gh pr merge --disable-auto "${{ github.event.pull_request.number }}" -R "${{ github.repository }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Arm auto-merge
        if: steps.check-automerge.outputs.eligible == 'true'
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}" -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
