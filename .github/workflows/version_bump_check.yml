name: 'CI: Version Bump Check'

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` so applying or removing the go:no-version-bump
    # exemption re-evaluates the check without a no-op push (PR #307 needed a
    # "chore: retrigger CI after version exemption" commit for exactly this).
    # The check reads live labels each run, so fail-closed is preserved: the
    # label present passes, the label removed re-fails when a bump is needed.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# The group includes the triggering event action: a `labeled` event fired
# seconds after `opened` (the eligibility labels are applied right after PR
# creation) must not cancel the `opened` run — a cancelled run of this
# required check stays on the head SHA and blocks the merge/auto-merge even
# after a newer run succeeds (observed on PRs #344-#346, 2026-08-13; each
# needed a manual re-run to unblock). Same-action storms still dedupe.
#
# The group also includes the label name for labeled/unlabeled events: a PR
# opened with two `gh pr create --label` flags fires two separate `labeled`
# webhook events (one per label), which previously shared one
# `...-labeled` group and cancelled each other -- reproducing the exact
# stuck-merge failure above one layer up (PR #393, 2026-08-14:
# `mergeStateStatus: BLOCKED` with every check green and auto-merge armed,
# stalled until a human manually re-ran the stray cancelled run). Empty for
# opened/synchronize/reopened (no `label` on the event payload), so those
# keep deduping exactly as before.
concurrency:
  group: version-bump-check-${{ github.event.pull_request.number }}-${{ github.event.action }}-${{ github.event.label.name || '' }}
  cancel-in-progress: true

jobs:
  version-bump-check:
    name: Version bump check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect changed files and pyproject.toml diff
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed_files.txt
          git diff "origin/${{ github.base_ref }}...HEAD" -- pyproject.toml > /tmp/version_diff.txt

      - name: Check version-bump label
        id: label
        run: |
          labels=$(gh pr view "${{ github.event.pull_request.number }}" \
            --json labels --jq '.labels[].name' -R "${{ github.repository }}")
          has_exempt="false"
          if echo "$labels" | grep -q "^go:no-version-bump$"; then
            has_exempt="true"
          fi
          echo "has_exempt=$has_exempt" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate version bump requirement
        id: check
        run: |
          bash scripts/ci/version_bump_check.sh \
            --changed-files /tmp/changed_files.txt \
            --version-diff /tmp/version_diff.txt \
            --has-exempt-label "${{ steps.label.outputs.has_exempt }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report
        run: |
          echo "required=${{ steps.check.outputs.required }}"
          echo "bumped=${{ steps.check.outputs.bumped }}"
          echo "exempt=${{ steps.check.outputs.exempt }}"
          echo "${{ steps.check.outputs.reason }}"
          if [ "${{ steps.check.outputs.pass }}" != "true" ]; then
            echo "::error::This PR changes src/worktrail/** without bumping pyproject.toml's version." \
              "Either bump the version (see the 'chore: bump Worktrail to X.Y.Z' commits for the" \
              "pattern -- pyproject.toml + .codex-plugin/plugin.json together), or apply the" \
              "go:no-version-bump label if this change is intentionally deferred to a future batch bump."
            exit 1
          fi
