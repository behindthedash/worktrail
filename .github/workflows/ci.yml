name: "CI: Lint, Test & Build"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      bookkeeping: ${{ steps.gate.outputs.bookkeeping }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Filter changed paths
        # PR-only: base ref (and thus a diff to filter) only exists for
        # pull_request events. Non-PR triggers use the fallback step below.
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!openspec/**'
              - '!docs/**'
              - '!**/*.md'

      - name: Non-PR fallback (always run full suite)
        # The existing push trigger to main (and any other non-PR trigger)
        # has no meaningful base to diff against, so always treat it as code.
        if: github.event_name != 'pull_request'
        id: fallback
        run: echo "code=true" >> "$GITHUB_OUTPUT"

      - name: Capture diff context
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff "origin/${{ github.base_ref }}...HEAD" -- pyproject.toml > /tmp/pyproject_diff.txt
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed_files.txt
          else
            : > /tmp/pyproject_diff.txt
            : > /tmp/changed_files.txt
          fi

      - name: Evaluate bookkeeping gate
        id: gate
        run: |
          bash scripts/ci/bookkeeping_gate.sh \
            --paths-filter-code "${{ steps.filter.outputs.code || steps.fallback.outputs.code }}" \
            --pyproject-diff /tmp/pyproject_diff.txt \
            --changed-files /tmp/changed_files.txt \
            --github-output "$GITHUB_OUTPUT"

  lint-test-build:
    name: "Lint, Test & Build"
    needs: changes
    # Always runs (never job-level `if:`-skipped) so its own check-run --
    # the one the branch ruleset's required_status_checks actually watches --
    # is always posted by *this* workflow run's own check suite. A separate
    # bookkeeping-bypass job that instead called checks.create() to post a
    # same-named synthetic check raced against every other workflow this same
    # pull_request event also triggers (auto-merge.yml, scope-check,
    # release-metadata-check): each gets its own check suite from the
    # github-actions app for the same commit, and the synthetic check could
    # land in a sibling workflow's suite instead of this one. Required-check
    # matching then never saw it there, so the required check sat "Expected
    # -- Waiting for status to be reported" forever (worktrail PR #653).
    # Gating each step individually below keeps the fast bookkeeping path
    # cheap while guaranteeing the check-run itself is unambiguous.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.bookkeeping == 'false'
      - uses: actions/setup-python@v7.0.0
        if: needs.changes.outputs.bookkeeping == 'false'
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dev-install worktree guard
        if: needs.changes.outputs.bookkeeping == 'false'
        run: bash scripts/ci/test_dev_install.sh
      - name: Install package and Ruff
        if: needs.changes.outputs.bookkeeping == 'false'
        run: pip install -e ".[dev]" ruff
      - name: Ruff lint
        if: needs.changes.outputs.bookkeeping == 'false'
        run: ruff check .
      - name: Ruff format check
        if: needs.changes.outputs.bookkeeping == 'false'
        run: ruff format --check .
      - name: pytest
        # The classifier coverage ratchet runs in its own advisory job below
        # (not yet in required_status_checks) so its baseline can be
        # recalibrated over a PR or two without blocking this required job.
        if: needs.changes.outputs.bookkeeping == 'false'
        run: pytest -q --ignore=tests/router/test_classifier_coverage_ratchet.py
      - name: Golden regression (orchestrator)
        if: needs.changes.outputs.bookkeeping == 'false'
        run: python3 -m worktrail.orchestrator.orchestrate check
      - name: Build
        if: needs.changes.outputs.bookkeeping == 'false'
        run: pip install build && python3 -m build
      - name: Built artifact packaging parity
        if: needs.changes.outputs.bookkeeping == 'false'
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          python3 scripts/check_built_artifact_packaging.py --wheel "$wheel" --sdist "$sdist"

  classifier-coverage-ratchet:
    name: "Classifier Coverage Ratchet"
    needs: changes
    if: needs.changes.outputs.bookkeeping == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Test
        # Advisory: not in required_status_checks yet (protect-main.json) so
        # tests/fixtures/classifier_corpus.json's baseline can be recalibrated
        # over a PR or two before this becomes a merge-blocking gate.
        run: pytest -q tests/router/test_classifier_coverage_ratchet.py

  installed-package-drain-smoke:
    name: "Installed drain smoke (${{ matrix.agent }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex, opencode]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Build wheel
        run: pip install build && python3 -m build --wheel
      - name: Exercise installed provider launcher
        run: |
          wheel=$(find dist -maxdepth 1 -name 'worktrail-*.whl' -print -quit)
          test -n "$wheel"
          python3 scripts/ci/installed_package_drain_smoke.py \
            --agent "${{ matrix.agent }}" \
            --wheel "$wheel" \
            --output "artifacts/${{ matrix.agent }}"
      - name: Publish exact smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-drain-smoke-${{ matrix.agent }}
          path: artifacts/${{ matrix.agent }}/
          if-no-files-found: error
