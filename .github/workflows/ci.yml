name: "CI: Lint, Test & Build"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: "Lint, Test & Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Dev-install worktree guard
        run: bash scripts/ci/test_dev_install.sh
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Golden regression (orchestrator)
        run: python3 -m worktrail.orchestrator.orchestrate check
      - name: Build
        run: pip install build && python3 -m build
